# sec-range v0 configuration. Copy to config.toml and edit.

[gateway]
base_url = "https://works.gascity.com/manifold-api"
key_path = "/home/ubuntu/.config/manifold/key.json"

[models]
# red = abliterated serve provider row when stood up; calibration uses an
# aligned model through the same gateway (refusals cost throughput, not truth)
red = "kimi-k3"
victim = "claude-fable-5-1"
adjudicator = "claude-opus-4-8"

[recorder]
tracker_port = 8899   # fake issue tracker (untrusted content delivery)
sink_port = 8898      # sinkhole: any http_post from the victim lands here

[episode]
max_red_iterations = 6
victim_max_turns = 12
